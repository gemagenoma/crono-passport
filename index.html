<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crono Passport Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <section class="form-section" id="formSection">
            <form id="passportForm">
                <input type="text" id="name" placeholder="¿Cuál fue tu nombre?" required>
                <input type="text" id="alias" placeholder="¿Cuál es tu apodo?" style="display: none;" required>
                <input type="text" id="job" placeholder="¿Cuál será tu ocupación en la Abadía?" style="display: none;" required>
                <div id="emailContainer" style="display: none;">
                    <input type="email" id="email" placeholder="¿Cuál es tu correo electrónico?" required>
                    <div class="status-message" id="emailStatus" style="display: none;">
                        <span class="spinner" aria-hidden="true"></span>
                        <span>Validando correo...</span>
                    </div>
                    <div class="error-message" id="emailError"></div>
                </div>
				<button id="generate" type="submit" class="submit-btn" style="display: none;">Generar Pasaporte</button>
                <div class="timer-container">
                    <p>Faltan <strong class="passport-id" id="timerDisplay">0</strong> centisegundos hasta <strong>enero</strong> de <strong>2027</strong></p>
                </div>
            </form>
        </section>

        <section class="passport-section" id="passportSection" style="display: none;">
            <div class="passport-card">
                <div class="passport-name" id="displayName">---</div>
                <div class="passport-alias" id="displayAlias">---</div>
                <div class="passport-job" id="displayJob">---</div>
                <div class="passport-id" id="displayId">---</div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
